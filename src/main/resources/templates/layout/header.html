<!-- Header -->
<header th:fragment="header" class= "bg-dark py-5" style="background-image: url('images/bg.jpg'); background-size: cover; background-position: center;">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center">
            <h3 class="fs-2 fw-medium" style="font-size: 2.5rem;">모두의 강의에서 원하는 강의를 찾아보세요.</h3>
            <!-- 검색창 추가 -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-6">
                    <form class="d-flex">
                        <input class="form-control me-2 text-white border-dark border-opacity-25" type="search" placeholder="검색어를 입력하세요" aria-label="Search">
                        <button class="btn search-button btn-primary me-2" type="submit" aria-label="검색">
                            <i class="bi bi-search text-white"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
