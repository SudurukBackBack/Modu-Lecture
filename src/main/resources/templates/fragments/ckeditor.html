<!doctype html>
<html lang="en" th:fragment="ckeditor" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>CKEditor 5 Sample</title>
    <link rel="stylesheet" href="/css/ckeditor.css">
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/44.2.1/ckeditor5.css" crossorigin>
</head>
<body>
<div class="main-container">
    <div class="editor-container editor-container_classic-editor" id="editor-container">
        <div class="editor-container__editor"><div id="editor"></div></div>
    </div>
</div>
<script src="https://cdn.ckeditor.com/ckeditor5/44.2.1/ckeditor5.umd.js" crossorigin></script>
<script src="https://cdn.ckeditor.com/ckeditor5/44.2.1/translations/ko.umd.js" crossorigin></script>
<script src="https://cdn.ckbox.io/ckbox/2.6.1/ckbox.js" crossorigin></script>
<script src="/js/ckeditor.js"></script>

<script>
    ClassicEditor
        .create(document.querySelector('#postContent'), {
            toolbar: {
                items: [
                    'heading', '|',
                    'bold', 'italic', 'underline', 'strikethrough', 'bulletedList', 'numberedList', '|',
                    'link', 'blockQuote', 'insertTable', 'undo', 'redo'
                ]
            },
            language: 'ko',
            licenseKey: '', // 필요한 경우 라이선스 키 입력
        })
        .then(editor => {
            window.editor = editor;
        })
        .catch(error => {
            console.error('CKEditor 초기화 중 에러 발생:', error);
        });
</script>
</body>
</html>
