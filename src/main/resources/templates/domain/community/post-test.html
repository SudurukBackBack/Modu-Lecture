<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 커뮤니티 </title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<main class="flex-fill">
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row">
                <!-- community vertical navigation bar -->
                <div th:replace="~{layout/community-navbar :: community-navbar}"></div>

                <!-- 오른쪽 내용 -->
                <div class="col-md-9">
                    <h2 class="mb-4 mt-4 me-4">전체 글 보기</h2>
                    <hr>

                    <!-- 게시판 시작 -->
                    <div class="table-responsive border rounded overflow-hidden">
                        <table class="table align-middle table-hover mb-0">
                            <tbody>
                            <!-- 공지사항 게시글 먼저 표시 (실제 데이터로 대체 필요) -->
                            <tr th:each="post : ${posts}" th:onclick="'window.location=\'/community/post-detail/' + ${post.id} + '\''" style="cursor: pointer;">
<!--                                <td>-->
<!--                                    <span th:if="${post.isNotice}" class="badge bg-primary bg-opacity-75 text-align-top ms-3">공지사항</span>-->
<!--                                </td>-->
                                <td>
                                    <p class="font-weight-bold" th:text="${post.id}"></p>
                                    <p class="text-dark fw-bold mb-1" th:text="${post.title}">게시글 제목</p>
                                    <p class="mb-0" th:text="${#strings.abbreviate(post.content, 50)}">게시글 내용 미리보기</p>
                                </td>
                                <td th:text="${postNicknames[post.id]}">작성자</td>
<!--                                <td class="text-center">-->
<!--                                    <i class="bi bi-chat"></i>-->
<!--                                    <span th:text="${post.commentCount}">0</span>-->
<!--                                </td>-->
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- 게시판 끝 -->

                    <!-- 페이지네이션 시작 -->

<!--                    <div class="pagination mt-3">-->
<!--                        <a th:href="@{/community(page=${currentPage - 1})}"-->
<!--                           class="btn btn-primary me-2">이전</a>-->

<!--                        <span class="mx-2" th:text="'현재 페이지: ' + (${currentPage + 1}) + ' / ' + ${totalPages}"></span>-->

<!--                        <a class="page-item" th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"-->
<!--                            th:classappend="${i == posts.number} ? 'active'">-->
<!--                            <a class="page-link text-dark text-opacity-75"-->
<!--                               th:href="@{/community(page=${i})}"-->
<!--                               th:text="${i + 1}"></a>-->
<!--                        </a>-->
<!--                        <a th:href="@{/community(page=${currentPage + 1})}"-->
<!--                           class="btn btn-primary ms-2">다음</a>-->
<!--                    </div>-->


                    <nav aria-label="Page navigation example">
                        <ul class="pagination justify-content-center mt-4">
                            <li class="page-item">
                                <a th:href="@{/community(page=${currentPage - 1})}" class="page-link text-dark">이전</a>
                            </li>
                            <li class="page-item"><a class="page-link text-dark text-opacity-75" href="/community?page=0">1</a></li>
                            <li class="page-item"><a class="page-link text-dark text-opacity-7" href="/community?page=1">2</a></li>
                            <li class="page-item"><a class="page-link text-dark text-opacity-7" href="/community?page=2">3</a></li>
                            <li class="page-item"><a class="page-link text-dark text-opacity-7" href="/community?page=3">4</a></li>
                            <li class="page-item"><a class="page-link text-dark text-opacity-7" href="/community?page=4">5</a></li>
                            <li class="page-item">
                                <a th:href="@{/community(page=${currentPage + 1})}" class="page-link text-dark">다음</a>
                            </li>
                        </ul>
                    </nav>
                    <!-- 페이지네이션 끝 -->
                </div>
            </div>
        </div>
    </section>
</main>


<!-- Footer-->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

</body>
</html>
