<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 커뮤니티 | 글상세 </title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<main class="flex-fill">
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row">

                <!-- mypage vertical navigation bar -->
                <div th:replace="~{layout/community-navbar :: community-navbar}"></div>

                <!-- 오른쪽 내용 -->
                <div class="col-md-9">
                    <h2 class="mb-4 mt-4 me-4">글 쓰기</h2>

                    <!-- 글쓰기 폼 -->
                    <div class="card p-4">
                        <form id="postForm" action="/community/post-write" method="post">
                            <!-- 제목 입력 -->
                            <div class="mb-3">
                                <input type="text" class="form-control form-control-lg me-2" id="postTitle" name="title" placeholder="제목을 입력하세요" required>
                            </div>

                            <!-- 카테고리 선택 -->
                            <div class="mb-3">
                                <select class="form-select text-opacity-50" id="postCategory" name="category" required>
                                    <option value="" disabled selected>카테고리를 선택하세요</option>
                                    <option value="공지">공지사항</option>
                                    <option value="질문">QnA</option>
                                    <option value="강의">강의</option>
                                    <option value="수다">수다</option>
                                </select>
                            </div>

                            <!-- 내용 입력 -->
                            <div class="mb-3">
                                <!-- toast-ui editor fragment 삽입 -->
                                <div th:replace="~{layout/toast-editor :: toast-editor}"></div>
                            </div>


                            <!-- 등록 버튼 -->
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-floppy"></i>등록
                                </button>
                            </div>
                        </form>
                    </div>
                    <!-- 글쓰기 폼 끝 -->
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer-->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>


<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />

<script>
    // 에디터 초기화
    const editor = new toastui.Editor({
        el: document.querySelector('#toast-editor'),
        height: '500px',
        initialEditType: 'wysiwyg',
        previewStyle: 'tab'
    });

    // submit 전에 editor 내용 textarea로 복사
    document.getElementById("postForm").addEventListener("submit", function (e) {
        const contentTextarea = document.getElementById("postContent");
        contentTextarea.value = editor.getMarkdown(); // 또는 getHTML()도 가능
    });
</script>
</body>
</html>
