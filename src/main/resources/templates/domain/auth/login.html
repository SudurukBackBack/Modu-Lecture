<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>모두의강의 - 커뮤니티 | 로그인 </title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<section class="vh-100" style="background-color: skyblue;">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-10">
                <div class="card" style="border-radius: 1rem;">
                    <div class="row g-0">
                        <div class="col-md-6 col-lg-5 d-none d-md-block">
                            <img src="/images/loginPage.webp"
                                 alt="login form" class="img-fluid" style="border-radius: 1rem 0 0 1rem;"/>
                        </div>
                        <div class="col-md-6 col-lg-7 d-flex align-items-center">
                            <div class="card-body p-4 p-lg-5 text-black">

                                <form>

                                    <div class="d-flex align-items-center mb-3 pb-1">
                                        <i class="fas fa-user fa-2x me-3" style="color: #ff6219;"> 환영합니다!</i>
                                        <span class="h1 fw-bold mb-0">모두의 강의</span>
                                    </div>

                                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">계정에 로그인하세요</h5>

                                    <div data-mdb-input-init class="form-outline mb-4">
                                        <label class="form-label" for="input-email">이메일 주소</label>
                                        <input type="email" id="input-email" class="form-control form-control-lg"/>
                                    </div>

                                    <div data-mdb-input-init class="form-outline mb-4 position-relative">
                                        <label class="form-label" for="input-password">비밀번호</label>
                                        <input type="password" id="input-password" class="form-control form-control-lg" />

                                        <!-- 눈 아이콘 (default: 마스킹 on 상태) -->
                                        <i id="toggle-password-visibility"
                                           class="fas fa-eye position-absolute"
                                           style="top: 70%; right: 15px; transform: translateY(-50%); cursor: pointer; font-size: 1.1rem;"></i>
                                    </div>

                                    <div class="pt-1 mb-4">
                                        <button id="login-btn" data-mdb-button-init data-mdb-ripple-init
                                                class="btn btn-dark btn-lg btn-block" type="button">로그인
                                        </button>
                                    </div>

                                    <a class="small text-muted" href="#!">비밀번호를 잊으셨나요?</a>
                                    <p class="mb-5 pb-lg-2" style="color: #393f81;">계정이 없으신가요? <a href="/web/v1/auth/register"
                                                                                                  style="color: #393f81;">회원가입</a>
                                    </p>
                                    <a href="#!" class="small text-muted">이용약관</a>
                                    <a href="#!" class="small text-muted">개인정보 처리 방침</a>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!--Bootstrap JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Axios 추가 (필수) -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!--사용자 정의 JS-->
<script>
    // URL에서 error 파라미터 확인
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error') && urlParams.get('error') === 'unauthorized') {
        alert("로그인이 필요한 서비스입니다.");
    }

    document.addEventListener("DOMContentLoaded", function () {
        const password = document.getElementById("input-password");
        const toggleIcon = document.getElementById("toggle-password-visibility");

        toggleIcon.addEventListener("click", function () {
            const isPassword = password.type === "password";
            password.type = isPassword ? "text" : "password";
            toggleIcon.classList.toggle("fa-eye", !isPassword);
            toggleIcon.classList.toggle("fa-eye-slash", isPassword);
        });
    });

    document.getElementById("login-btn").addEventListener("click", async function () {
        // 값 가져오기
        const email = document.getElementById("input-email").value.trim();
        const password = document.getElementById("input-password").value.trim();

        if (!email || !password) {
            showAlert("이메일과 비밀번호를 입력해주세요.", "danger");
            return;
        }

        const requestData = {email, password};

        try {
            console.log("로그인 요청 데이터:", requestData);

            // 로그인 API 요청 (쿠키 기반 인증)
            const response = await fetch("/api/v1/auth/sign-in",
                {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(requestData),
                    credentials: "include"
                });

            // 응답 데이터 처리
            const result = await response.json();

            if (response.ok) {
                console.log("로그인 성공:", result.message);
                window.location.href = "/main";
            } else {
                console.error("로그인 실패:", result);
                // API 응답에서 `errorMessage` 값을 가져와서 showAlert로 표시
                const errorMessage = result.errorMessage || "로그인에 실패했습니다.";
                showAlert(`[${response.status}] ${errorMessage}`, "danger");
            }

        } catch (error) {
            console.error("로그인 요청 오류:", error);

            // 서버 응답이 없는 경우 (네트워크 오류 등)
            showAlert("서버와의 연결이 원활하지 않습니다.", "danger");
        }
    });

    function showAlert(message, type, callback) {
        const modalHtml = `
        <div class="modal fade" id="alertModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">${type === "success" ? "성공" : "오류"}</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <pre style="white-space: pre-wrap; word-break: break-word;">${message}</pre>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">확인</button>
                    </div>
                </div>
            </div>
        </div>
    `;
        // 기존 모달 제거 후 새로 추가
        document.body.insertAdjacentHTML("beforeend", modalHtml);
        const modal = new bootstrap.Modal(document.getElementById("alertModal"));
        modal.show();

        // 모달 닫힐 때 콜백 실행 (성공 시 페이지 이동)
        document.getElementById("alertModal").addEventListener("hidden.bs.modal", function () {
            if (callback) callback();
            document.getElementById("alertModal").remove(); // 모달 삭제
        });
    }
</script>

<!-- Footer-->
<div th:insert="~{layout/footer :: footer}"></div>

</body>
</html>
