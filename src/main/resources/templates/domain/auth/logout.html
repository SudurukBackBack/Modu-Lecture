<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>로그아웃</title>
</head>
<body>

<script>
    document.addEventListener('DOMContentLoaded', async function () {
        try {
            const response = await fetch("/auth/sign-out",
                {
                    method: "POST",
                    credentials: "include"
                });

            if (response.ok) {
                alert("로그아웃 되었습니다.");
                setTimeout(() => {
                    window.location.href = "/logoutUrl";
                }, 500); // 0.5초 딜레이 추가
            } else {
                alert("로그아웃 실패: 서버에서 응답이 없습니다.");
            }
        } catch (error) {
            console.error("로그아웃 요청 오류:", error);
            alert("로그아웃 중 오류가 발생했습니다. 다시 시도해주세요.");
        }
    });
</script>

</body>
</html>
