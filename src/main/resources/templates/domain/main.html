<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의 강의</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>

    <style>
        /* 기본 링크 스타일 제거 */
        a {
            text-decoration: none; /* 링크의 기본 밑줄 제거 */
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            padding-bottom: 65%; /* 5:3 비율을 유지하기 위한 패딩 */
            background-color: #f0f0f0; /* 기본 배경색 (이미지가 없는 경우를 대비) */
        }

        .thumbnail-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지를 박스에 맞게 자름 */
        }

        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .card-body2 {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
        }

        /* 카드 호버 시 살짝 올라가는 효과 */
        .card {
            transition: transform 0.3s ease; /* 변환 효과 */
        }

        .card:hover {
            transform: translateY(-10px); /* 위로 10px 올라가게 */
        }
    </style>

</head>

<body>
<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- header 부분 포함 -->
<div th:insert="~{layout/header :: header}"></div>

<!-- 4 x N Grid-->
<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4">

            <!-- 강의 카드를 반복문으로 출력 -->
            <div th:each="lecture : ${lectures}" class="col-md-4 mb-4">
                <!-- 카드 전체를 클릭하면 링크로 이동하도록 a 태그로 감싸기 -->
                <a th:href="@{/e-learning/detail/{lectureId}(lectureId=${lecture.id})}" class="card h-100">
                    <div class="thumbnail-box">
                        <img src="/images/thumbnail.png" class="card-img-top" alt="썸네일">
                        <!-- 플레이 아이콘 -->
                        <div class="position-absolute top-50 start-50 translate-middle">
                            <i class="bi bi-play-circle-fill" style="font-size: 40px; color: rgba(255, 255, 255, 0.8);"></i>
                        </div>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${lecture.title}">강의 제목</h5>

                        <div class="card-body2">
                            <!-- 강사 이름 -->
                            <h6 class="text-dark text-opacity-75 instructor-name">
                                <i class="bi bi-person-fill"></i>
                                <span th:text="${lecture.instructor.nickname}">강사 이름</span> <!-- 강사 이름 표시 -->
                            </h6>

                            <!-- 가격 -->
                            <div class="price-box">
                                <h6 class="d-inline">₩</h6>
                                <h6 class="d-inline" th:text="${#numbers.formatInteger(lecture.price, 0, 'COMMA')}"></h6>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>
</section>

<!-- Footer-->
<div th:insert  = "~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace  = "~{layout/js-cdn :: js-cdn}"></div>

</body>

</html>
