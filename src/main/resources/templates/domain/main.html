<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의 강의</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>

    <style>
        /* 기본 링크 스타일 제거 */
        a {
            text-decoration: none;
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            padding-bottom: 65%;
            background-color: #f0f0f0;
        }

        .thumbnail-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .card-body2 {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
        }

        /* 카드 호버 효과 */
        .card {
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }
    </style>
</head>

<body>

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- 검색 입력창 -->
<div class="container my-4">
    <form th:action="@{/main}" method="get" class="d-flex justify-content-center">
        <input type="text" name="keyword" class="form-control w-50"
               placeholder="강의 검색..." th:value="${keyword}" />
        <button type="submit" class="btn btn-primary ms-2">검색</button>
    </form>
</div>

<!-- 검색 결과 또는 최신 강의 목록 -->
<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <h4 th:if="${keyword}">"[[${keyword}]]" 검색 결과</h4>
        <h4 th:unless="${keyword}">최신 강의</h4>
        <hr>

        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4">
            <div th:each="lecture : ${lectures}" class="col-md-4 mb-4">
                <a th:href="@{/e-learning/detail/{lectureId}(lectureId=${lecture.lectureId})}" class="card h-100">
                    <div class="thumbnail-box">
                        <img src="/images/thumbnail.png" class="card-img-top" alt="썸네일">
                        <div class="position-absolute top-50 start-50 translate-middle">
                            <i class="bi bi-play-circle-fill" style="font-size: 40px; color: rgba(255, 255, 255, 0.8);"></i>
                        </div>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${lecture.title}">강의 제목</h5>
                        <div class="card-body2">
                            <h6 class="text-dark text-opacity-75 instructor-name">
                                <i class="bi bi-person-fill"></i>
                                <span th:text="${lecture.instructor}">강사 이름</span>
                            </h6>
                            <div class="price-box">
                                <h6 class="d-inline">₩</h6>
                                <h6 class="d-inline" th:text="${#numbers.formatInteger(lecture.price, 0, 'COMMA')}"></h6>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>

<!-- Footer-->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

</body>
</html>
