<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>모두의강의 - 마이페이지 | 나의정보</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>

    <style>
        .thumbnail-box {
            position: relative;
        }

        .lecture-info-box {
            position: fixed;
            max-width: 350px; /* 썸네일과 동일한 크기 */
            width: 100%;
            transition: top 0.2s ease;
        }

        .lecture-info-box.fixed {
            top: 100px; /* navbar 바로 아래에 위치 */
        }

        .lecture-info-box.initial {
            top: 45%; /* 화면 중앙에 위치 */
        }

        @media (max-width: 767px) {
            .lecture-info-box {
                position: fixed;
                bottom: 0;
                top: auto; /* 위쪽 위치 제거 */
                border-radius: 0;
            }
        }

        /* 모달 스타일 */
        .modal-content {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Header -->
<header th:fragment="header" class="bg-dark">
    <div class="container px-lg-5 my-5">
        <div class="row align-items-center">
            <div class="col-md-6 text-white">
                <div class="mb-3">
                    <span class="badge bg-primary">컴퓨터공학</span>
                </div>
                <h2 class="fw-bold mb-3" th:text="${lecture.title}"></h2>
                <div class="d-flex align-items-center">
                    <i class="bi bi-person-circle me-2 fs-4"></i>
                    <span class="fs-5" th:text="${lecture.instructor}"></span>
                </div>
            </div>
            <div class="thumbnail-box col-md-6 d-flex flex-column align-items-end mb-0">
                <img src="/images/thumbnail.png" alt="썸네일"
                     class="img-fluid rounded shadow mb-3" style="max-width: 350px;">
                <div class="lecture-info-box card shadow p-3 bg-white rounded text-dark initial" style="max-width: 350px; width: 100%;">
                    <div class="price-box display-block">
                        <h2 class="d-inline">₩</h2>
                        <h2 class="d-inline" th:text="${#numbers.formatInteger(lecture.price, 0, 'COMMA')}"></h2>
                    </div>
                    <hr>
                    <table class="table mb-3">
                        <tbody>
                        <tr><th>강의길이</th><td>15분 30초</td></tr>
                        <tr><th>수강기한</th><td>평생소장</td></tr>
                        <tr><th>강사</th><td th:text="${lecture.instructor}"></td></tr>
                        </tbody>
                    </table>
                    <!-- 수강 신청 버튼 -->
                    <button class="btn btn-lg btn-primary mt-auto" id="enrollButton" th:data-lecture-id="${lecture.lectureId}">
                        수강 신청
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Section -->
<main class="flex-fill">
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row">
                <!-- 강의 설명 -->
                <div class="col">
                    <div th:utext="${lecture.description}"></div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

<!-- 모달 -->
<div class="modal" tabindex="-1" id="enrollmentModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">수강 신청 완료</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-footer">
                <a href="#" id="goToLecture" class="btn btn-primary">수강하러 가기</a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<!-- 이미 등록된 강의 모달 -->
<div class="modal fade" id="alreadyEnrolledModal" tabindex="-1" aria-labelledby="alreadyEnrolledLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">수강 신청 실패</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>이미 등록된 강의입니다.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("enrollButton").addEventListener("click", function() {
            var lectureId = this.getAttribute("data-lecture-id");

            if (!lectureId) {
                alert("강의 정보를 불러올 수 없습니다.");
                return;
            }

            fetch(`/enroll/${lectureId}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            })
                .then(response => {
                    if (response.status === 409) {
                        // 이미 수강 신청한 강의인 경우 모달 띄우기
                        var modal = new bootstrap.Modal(document.getElementById('alreadyEnrolledModal'));
                        modal.show();
                        throw new Error("이미 수강 신청한 강의입니다.");
                    }

                    if (response.ok) {
                        // 수강 신청 성공 시 모달 띄우기
                        var modal = new bootstrap.Modal(document.getElementById('enrollmentModal'));
                        modal.show();

                        // "수강하러 가기" 버튼에 강의 ID 적용
                        document.getElementById("goToLecture").setAttribute("href", `/e-learning/${lectureId}`);
                        return;
                    }

                    throw new Error("수강 신청에 실패했습니다.");
                })
                .catch(error => {
                    console.error("Error:", error);
                });
        });
    });
</script>




</body>
</html>
