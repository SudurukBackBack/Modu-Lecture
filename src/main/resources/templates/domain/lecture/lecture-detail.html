<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>모두의강의 - 마이페이지 | 나의정보</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<main class="flex-fill">
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row">

                <!-- 강의 타이틀 -->
                <div class="col-12">
                    <h2 class="fw-bold" th:text="${lecture.title}"></h2>
                    <hr>
                </div>

                <!-- 강의 재생 화면과 상세 정보 -->
                <div class="d-flex col-12">

                    <!-- 강의 재생 화면 -->
                    <div class="flex-grow-1 me-3 border rounded shadow-sm">
                        <div class="video-container">
                            <img controls width="100%" src="/images/test.jpg">
                        </div>
                        <p class="mt-3 ms-3 mb-3"><strong>강의 길이 :</strong> <span>15:00:00</span></p>
                    </div>

                    <!-- 강의 상세 정보 -->
                    <div class="col-md-4 d-flex flex-column">
                        <div class="card shadow-sm p-3 bg-white rounded flex-grow-1">
                            <table class="table mb-3">
                                <tbody>
                                <tr>
                                    <th>카테고리</th>
                                    <td>컴퓨터공학</td>
                                </tr>
                                <tr>
                                    <th>가격</th>
                                    <td th:text="${lecture.price}">무료</td>
                                </tr>
                                <tr>
                                    <th>강사</th>
                                    <td th:text="${lecture.instructor}">김모두</td>
                                </tr>
                                </tbody>
                            </table>
                            <a href="#" class="btn btn-primary w-100 mt-auto">수강 신청</a>
                        </div>
                    </div>
                </div>

            </div>

            <hr class="my-5">

            <!-- 강의 설명 -->
            <div class="row">
                <div class="col">
                    <div th:utext="${lecture.description}"></div>
                </div>
            </div>
        </div>
    </section>
</main>
<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

</body>
</html>
