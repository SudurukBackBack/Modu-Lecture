<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>모두의강의 - 마이페이지 | 나의정보</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>

    <style>

        .thumbnail-box {
            position: relative;
        }

        .lecture-info-box {
            position: fixed;
            max-width: 350px; /* 썸네일과 동일한 크기 */
            width: 100%;
            transition: top 0.2s ease;
        }

        /* 화면 크기가 일정 크기 이상일 때 */
        .lecture-info-box.fixed {
            top: 100px; /* navbar 바로 아래에 위치 */
        }

        /* 화면 크기가 일정 크기 이하일 때 */
        .lecture-info-box.initial {
            top: 45%; /* 화면 중앙에 위치 */
        }

        /* 화면이 작아졌을 때 lecture-info-box를 화면 하단에 고정 */
        @media (max-width: 767px) {
            .lecture-info-box {
                position: fixed;
                bottom: 0;
                top: auto; /* 위쪽 위치 제거 */
                border-radius: 0;
            }
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Header -->
<header th:fragment="header" class="bg-dark">
    <div class="container px-lg-5 my-5">
        <div class="row align-items-center">

            <!-- 왼쪽: 강의 정보 -->
            <div class="col-md-6 text-white">

                <!-- 강의 카테고리 (태그 형태) -->
                <div class="mb-3">
                    <span class="badge bg-primary">컴퓨터공학</span>
                </div>

                <!-- 강의 제목 -->
                <h2 class="fw-bold mb-3" th:text="${lecture.title}"></h2>

                <!-- 강사 정보 -->
                <div class="d-flex align-items-center">
                    <i class="bi bi-person-circle me-2 fs-4"></i>
                    <span class="fs-5" th:text="${lecture.instructor}"></span>
                </div>
            </div>

            <!-- 오른쪽: 강의 썸네일 & 강의 상세 정보 -->
            <div class="thumbnail-box col-md-6 d-flex flex-column align-items-end mb-0">
                <!-- 강의 썸네일 -->
                <img src="/images/thumbnail.png" alt="썸네일"
                     class="img-fluid rounded shadow mb-3" style="max-width: 350px;">

                <!-- 강의 상세 정보 (고정 위치) -->
                <div class="lecture-info-box card shadow p-3 bg-white rounded text-dark initial" style="max-width: 350px; width: 100%;">

                    <!-- 가격을 h2로 강조 -->
                    <div class="price-box display-block">
                        <h2 class="d-inline">₩</h2>
                        <h2 class="fw-bold mb-3 d-inline" id="price" th:text="${lecture.price}"></h2>
                    </div>

                    <hr>

                    <table class="table mb-3">
                        <tbody>
                        <tr>
                            <th>강의길이</th>
                            <td>15분 30초</td>
                        </tr>
                        <tr>
                            <th>수강기한</th>
                            <td>평생소장</td>
                        </tr>
                        <tr>
                            <th>강사</th>
                            <td th:text="${lecture.instructor}"></td>
                        </tr>
                        </tbody>
                    </table>
                    <a href="#" class="btn btn-lg btn-primary mt-auto">수강 신청</a>
                </div>

            </div>
        </div>
    </div>
</header>

<!-- Section -->
<main class="flex-fill">
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row">
            </div>

            <!-- 강의 설명 -->
            <div class="row">
                <div class="col">
                    <div th:utext="${lecture.description}"></div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

<script>
    // 페이지 로드 후 가격을 포맷팅
    window.onload = function() {
        var priceElement = document.getElementById('price');
        var price = priceElement.innerText;
        // 숫자로 변환 후 포맷 적용
        priceElement.innerText = new Intl.NumberFormat('ko-KR').format(price);
    };

    window.addEventListener('scroll', function() {
        var lectureInfoBox = document.querySelector('.lecture-info-box');
        var navbarHeight = document.querySelector('nav').offsetHeight;
        if (window.scrollY > navbarHeight && window.innerWidth > 767) {
            lectureInfoBox.classList.add('fixed');
            lectureInfoBox.classList.remove('initial');
        } else if (window.innerWidth > 767) {
            lectureInfoBox.classList.remove('fixed');
            lectureInfoBox.classList.add('initial');
        }
    });
</script>

</body>
</html>
