<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>모두의강의 - 강의 상세</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<main class="flex-fill">
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row">

                <!-- 강의 타이틀 -->
                <div class="col-12">
                    <div class="mb-3">
                        <span class="badge bg-primary">컴퓨터공학</span>
                    </div>
                    <h2 class="fw-bold" th:text="${lecture.title}"></h2>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-person-circle me-2 fs-4"></i>
                        <span class="fs-5" th:text="${lecture.instructor}"></span>
                    </div>

                    <!-- 좋아요 버튼 -->
                    <div class="mt-3">
                        <button id="like-btn" class="btn btn-outline-danger" onclick="toggleLike()">
                            <i id="like-icon" class="bi bi-heart"></i>
                            <span id="like-text">좋아요</span>
                        </button>
                    </div>

                    <hr>
                </div>

                <!-- 강의 재생 화면과 상세 정보 -->
                <div class="d-flex col-12">
                    <!-- 강의 재생 화면 -->
                    <div class="flex-grow-1 me-3 border rounded shadow-sm">
                        <div class="video-container">
                            <video controls width="100%" poster="/images/test.jpg">
                                <source src="/images/testtest.mp4" type="video/mp4">
                                브라우저가 비디오 태그를 지원하지 않습니다.
                            </video>
                        </div>
                        <p class="mt-3 ms-3 mb-3"><strong>강의 길이 :</strong> <span>15:00:00</span></p>
                    </div>
                </div>

            </div>

            <hr class="my-5">

            <!-- 강의 설명 -->
            <div class="row">
                <div class="col">
                    <div th:utext="${lecture.description}"></div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

<!-- 좋아요 토글 JS -->
<script>
    let liked = false;

    function toggleLike() {
        const lectureId = /*[[${lecture.lectureId}]]*/ 0;  // Thymeleaf 처리 필요

        fetch('/lectures/like/' + lectureId, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(response => {
            if (response.ok) {
                liked = !liked;
                const icon = document.getElementById('like-icon');
                const text = document.getElementById('like-text');

                if (liked) {
                    icon.classList.remove('bi-heart');
                    icon.classList.add('bi-heart-fill');
                    text.textContent = '좋아요 취소';
                } else {
                    icon.classList.remove('bi-heart-fill');
                    icon.classList.add('bi-heart');
                    text.textContent = '좋아요';
                }
            }
        });
    }
</script>

</body>
</html>
