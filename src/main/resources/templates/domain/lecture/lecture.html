<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:fragment="head">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>모두의강의 - 강의 상세</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<main class="flex-fill">
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row">

                <!-- 강의 타이틀 -->
                <div class="col-12">
                    <div class="mb-3">
                        <span class="badge bg-primary">컴퓨터공학</span>
                    </div>
                    <h2 class="fw-bold" th:text="${lecture.title}">강의 제목</h2>

                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-person-circle me-2 fs-4"></i>
                        <span class="fs-5" th:text="${lecture.instructor}">강사 이름</span>
                    </div>

                    <!-- 좋아요 버튼 -->
                    <button id="like-btn" class="btn btn-outline-danger">
                        <i id="like-icon" class="bi bi-heart"></i>
                        <span id="like-text">좋아요</span>
                    </button>

                    <hr>
                </div>

                <!-- 강의 영상 및 정보 -->
                <div class="d-flex col-12">
                    <div class="flex-grow-1 me-3 border rounded shadow-sm">
                        <div class="video-container">
                            <video controls width="100%" poster="/images/test.jpg">
                                <source src="/images/testtest.mp4" type="video/mp4">
                                브라우저가 비디오 태그를 지원하지 않습니다.
                            </video>
                        </div>
                        <p class="mt-3 ms-3 mb-3"><strong>강의 길이 :</strong> <span>15:00:00</span></p>
                    </div>
                </div>
            </div>

            <hr class="my-5">

            <!-- 강의 설명 -->
            <div class="row">
                <div class="col">
                    <div th:utext="${lecture.description}">강의 설명이 출력됩니다.</div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- 좋아요 Ajax Script -->
<script th:inline="javascript">
    let liked = false;

    $(document).ready(function () {
        const lectureId = [[${lecture.lectureId}]];

        // 초기 좋아요 상태 불러오기
        $.ajax({
            url: `/lectures/like/${lectureId}`,
            type: 'GET',
            success: function (data) {
                liked = data;
                updateLikeButton();
            },
            error: function () {
                console.error('좋아요 상태 불러오기 실패');
            }
        });

        // 버튼 클릭 시 토글
        $('#like-btn').click(function () {
            $.ajax({
                url: `/lectures/like/${lectureId}`,
                type: 'POST',
                contentType: 'application/json',
                success: function () {
                    liked = !liked;
                    updateLikeButton();
                },
                error: function () {
                    alert('좋아요 처리 중 오류 발생');
                }
            });
        });

        function updateLikeButton() {
            const $icon = $('#like-icon');
            const $text = $('#like-text');

            if (liked) {
                $icon.removeClass('bi-heart').addClass('bi-heart-fill');
                $text.text('좋아요 취소');
            } else {
                $icon.removeClass('bi-heart-fill').addClass('bi-heart');
                $text.text('좋아요');
            }
        }
    });
</script>

</body>
</html>
