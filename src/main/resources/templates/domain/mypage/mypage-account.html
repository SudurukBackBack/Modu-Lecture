<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 마이페이지 | 계정</title>

    <!-- CSS-CDN -->
    <div th:replace="layout/css-cdn :: css-cdn"></div>
</head>

<body class="d-flex flex-column min-vh-100">
<!-- navbar 부분 포함 -->
<div th:insert="layout/navbar :: navbar"></div>

<!-- Section -->
<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">

            <!-- mypage vertical navigation bar -->
            <div th:replace="layout/mypage-navbar :: mypage-navbar"></div>

            <!-- 오른쪽 내용 -->
            <div class="col-md-9">
                <h2 class="mb-4 mt-3">계정</h2>
                <hr>
                <!-- 등록 버튼 -->
                <div class="text-end">
                    <button type="submit" class="btn btn-dark opacity-50">탈퇴</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer-->
<div th:insert="layout/footer :: footer"></div>

<!-- JS CDN -->
<div th:replace="layout/js-cdn :: js-cdn"></div>
</body>
</html>
