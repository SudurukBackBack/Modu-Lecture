<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 마이페이지 | 강의관리</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">

            <!-- mypage vertical navigation bar -->
            <div th:replace="~{layout/mypage-navbar :: mypage-navbar}"></div>

            <!-- 오른쪽 내용 -->
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
                    <h2>나의 강의 관리</h2>
                    <!-- 강의 등록 버튼 -->
                    <a href="/mypage/tutor-upload" class="btn btn-primary">강의 등록</a>
                </div>

                <hr>

                <!-- 강의 목록 -->
                <div class="row">
                    <!-- 강의 목록이 없을 경우 메시지 출력 -->
                    <div th:if="${#lists.isEmpty(instructorLectures)}" class="text-center">
                        <p class="text-muted">등록된 강의가 없습니다.</p>
                    </div>

                    <!-- 강의 카드 -->
                    <div th:each="lecture : ${instructorLectures}" class="col-md-4 mb-4">
                        <div class="card h-100">
                            <div class="position-relative">
                                <img src="/images/test.jpg" class="card-img-top" th:alt="${lecture.title}">
                                <!-- 플레이 아이콘 -->
                                <div class="position-absolute top-50 start-50 translate-middle">
                                    <i class="bi bi-play-circle-fill" style="font-size: 40px; color: rgba(255, 255, 255, 0.8);"></i>
                                </div>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${lecture.title}"></h5>
                                <h6 class="text-dark text-opacity-75" th:text="${lecture.instructor}"></h6>
                                <hr>
                                <p class="card-text" th:text="${lecture.description}"></p>
                                <a th:href="@{/mypage/tutor-update(id=${lecture.lectureId})}" class="btn btn-primary">수정하기</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 강의 목록 종료 -->
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

</body>
</html>
