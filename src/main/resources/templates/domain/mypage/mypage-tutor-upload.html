<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 마이페이지 | 강의등록</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="layout/navbar :: navbar"></div>

<!-- Section -->
<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">

            <!-- mypage vertical navigation bar -->
            <div th:replace="layout/mypage-navbar :: mypage-navbar"></div>

            <!-- 오른쪽 내용 -->
            <div class="col-md-9">
                <h2 class="mb-4 mt-3">강의 등록</h2>
                <hr>
                <!-- 모서리가 둥근 테두리 시작 -->
                <div class="border rounded p-4">
                    <form th:action="@{/lectures}" th:object="${lectureCreateRequestDto}" method="post" enctype="multipart/form-data">

                        <!-- 제목 입력 -->
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-lg" id="title" placeholder="제목을 입력하세요" th:field="*{title}">
                        </div>

                        <!-- 가격 입력 -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <input type="number" class="form-control form-control-sm" id="priceInput"
                                       th:field="*{price}" placeholder="가격을 입력하세요">
                            </div>
                        </div>

                        <!-- 영상 업로드 -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <!-- 수정 후 -->
                                <input class="form-control form-control-sm" type="file" id="videoUpload"
                                       th:field="*{video}">
                            </div>
                        </div>

                        <!-- 카테고리 선택 (기존 코드 유지) -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <div class="card card-body w-100">
                                    <div class="row">
                                        <div class="col-md-3" th:each="category : ${categories}">
                                            <div class="form-check">
                                                <label>
                                                    <input class="form-check-input" type="checkbox"
                                                           th:id="${'category' + category.id}"
                                                           th:field="*{categoryIds}"
                                                           th:value="${category.id}">
                                                </label>
                                                <label class="form-check-label"
                                                       th:for="'category' + ${category.id}"
                                                       th:text="${category.categoryName}"></label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 설명 입력 -->
                        <div class="mb-3 row">
                            <div class="mb-3 w-100">
                                <!-- Hidden input to store editor content -->
                                <textarea th:field="*{description}"></textarea>
<!--                                <div id="editor"></div>-->
<!--                                <input type="hidden" th:field="*{description}" id="descriptionInput" name="description">-->
                            </div>
                        </div>

                        <!-- 경계선 -->
                        <hr>

                        <!-- 등록 버튼 -->
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">등록</button>
                        </div>
                    </form>
                </div>
                <!-- 모서리가 둥근 테두리 종료 -->
            </div>
        </div>
    </div>
</section>

<!-- Footer-->
<div th:insert="layout/footer :: footer"></div>

<!-- JS CDN -->
<div th:replace="layout/js-cdn :: js-cdn"></div>
