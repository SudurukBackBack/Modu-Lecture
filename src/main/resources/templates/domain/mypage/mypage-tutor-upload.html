<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- head 부분 포함 -->
<head th:fragment="head" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 마이페이지 | 강의등록</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">

            <!-- mypage vertical navigation bar -->
            <div th:replace="~{layout/mypage-navbar :: mypage-navbar}"></div>

            <!-- 오른쪽 내용 -->
            <div class="col-md-9">
                <h2 class="mb-4 mt-3">강의 등록</h2>
                <hr>
                <!-- 모서리가 둥근 테두리 시작 -->
                <div class="border rounded p-4">
                    <form th:action="@{/lectures/register}" method="post" enctype="multipart/form-data">

                        <!-- 제목 입력 -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <input type="text" class="form-control form-control-lg" id="titleInput" name="title" placeholder="강의 제목을 입력하세요">
                            </div>
                        </div>

                        <!-- 가격 입력 -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <input type="number" class="form-control form-control-sm" id="priceInput" name="price" placeholder="가격을 입력하세요">
                            </div>
                        </div>

                        <!-- 영상 업로드 -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <input class="form-control form-control-sm" type="file" id="videoUpload" name="video" value="강의 영상을 등록하세요">
                            </div>
                        </div>

                        <!-- 카테고리 선택 (슬라이드) -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <div class="card card-body w-100">
                                    <!-- 카테고리 리스트 -->
                                    <div class="row">
                                        <!-- 첫 번째 열 -->
                                        <div class="col-md-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category1" name="categories" value="프로그래밍">
                                                <label class="form-check-label" for="category1">프로그래밍</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category2" name="categories" value="데이터 과학">
                                                <label class="form-check-label" for="category2">데이터</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category3" name="categories" value="인공지능">
                                                <label class="form-check-label" for="category3">인공지능</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category4" name="categories" value="웹 개발">
                                                <label class="form-check-label" for="category4">웹 개발</label>
                                            </div>
                                        </div>
                                        <!-- 두 번째 열 -->
                                        <div class="col-md-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category5" name="categories" value="디자인">
                                                <label class="form-check-label" for="category5">디자인</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category6" name="categories" value="사진">
                                                <label class="form-check-label" for="category6">사진</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category7" name="categories" value="음악">
                                                <label class="form-check-label" for="category7">음악</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category8" name="categories" value="미술">
                                                <label class="form-check-label" for="category8">미술</label>
                                            </div>
                                        </div>
                                        <!-- 세 번째 열 -->
                                        <div class="col-md-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category9" name="categories" value="언어">
                                                <label class="form-check-label" for="category9">언어</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category10" name="categories" value="역사">
                                                <label class="form-check-label" for="category10">역사</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category11" name="categories" value="철학">
                                                <label class="form-check-label" for="category11">철학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category12" name="categories" value="문학">
                                                <label class="form-check-label" for="category12">문학</label>
                                            </div>
                                        </div>
                                        <!-- 네 번째 열 -->
                                        <div class="col-md-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category13" name="categories" value="물리학">
                                                <label class="form-check-label" for="category13">물리학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category14" name="categories" value="화학">
                                                <label class="form-check-label" for="category14">화학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category15" name="categories" value="생물학">
                                                <label class="form-check-label" for="category15">생물학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category16" name="categories" value="심리학">
                                                <label class="form-check-label" for="category16">심리학</label>
                                            </div>
                                        </div>
                                        <!-- 다섯 번째 열 -->
                                        <div class="col-md-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category17" name="categories" value="경영학">
                                                <label class="form-check-label" for="category17">경영학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category18" name="categories" value="마케팅 전략">
                                                <label class="form-check-label" for="category18">마케팅</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category19" name="categories" value="경제학">
                                                <label class="form-check-label" for="category19">경제학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category20" name="categories" value="금융">
                                                <label class="form-check-label" for="category20">금융</label>
                                            </div>
                                        </div>
                                        <!-- 여섯 번째 열 -->
                                        <div class="col-md-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category21" name="categories" value="의학">
                                                <label class="form-check-label" for="category21">의학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category22" name="categories" value="영양학">
                                                <label class="form-check-label" for="category22">영양학</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category23" name="categories" value="피트니스">
                                                <label class="form-check-label" for="category23">피트니스</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="category24" name="categories" value="건강">
                                                <label class="form-check-label" for="category24">건강</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 설명 입력 -->
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <div th:replace="~{layout/toast-editor :: toast-editor}"></div>
                            </div>
                        </div>

                        <!-- 경계선 -->
                        <hr>

                        <!-- 등록 버튼 -->
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">등록</button>
                        </div>
                    </form>
                </div>
                <!-- 모서리가 둥근 테두리 종료 -->
            </div>
        </div>
    </div>
</section>

<!-- Footer-->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

</body>
</html>
