<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 마이페이지 | 강의등록</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">
<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">

            <!-- mypage vertical navigation bar -->
            <div th:replace="~{layout/mypage-navbar :: mypage-navbar}"></div>

            <div class="col-md-9">
                <h2 class="mb-4 mt-3">강의 등록</h2>
                <hr>
                <div class="border rounded p-4">
                    <form id="lectureForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-lg" id="titleInput" placeholder="제목을 입력하세요" name="title">
                        </div>
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <input type="number" class="form-control form-control-sm" id="priceInput" name="price" placeholder="가격을 입력하세요">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <input class="form-control form-control-sm" type="file" id="videoUpload" name="video">
                                <input type="hidden" id="videoDuration" name="duration">
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <div class="mb-3">
                                <div class="card card-body w-100">
                                    <div class="row">
                                        <div class="col-md-3" th:each="category : ${categories}">
                                            <div class="form-check">
                                                <label>
                                                    <input class="form-check-input" type="checkbox"
                                                           th:id="${'category' + category.id}"
                                                           name="categoryIds"
                                                           th:value="${category.id}">
                                                </label>
                                                <label class="form-check-label" th:for="'category' + ${category.id}" th:text="${category.categoryName}"></label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <div class="mb-3 w-100">
                                <div id="editor"></div>
                                <input type="hidden" id="descriptionInput" name="description">
                            </div>
                        </div>
                        <hr>
                        <div class="text-end">
                            <button type="button" class="btn btn-primary" onclick="submitForm()">등록</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer-->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

<script>
    // 전역에서 submitForm 함수 정의
    async function submitForm() {
        const form = document.querySelector('#lectureForm');
        const editor = window.editor; // editor는 전역 변수로 설정될 것입니다.

        document.querySelector('#descriptionInput').value = editor.getHTML();

        if (!(await validateForm(form, editor))) {
            return;
        }

        const formData = new FormData(form);

        try {
            const response = await fetch('/lectures/create', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData);
            }

            const data = await response.json();
            alert('강의가 성공적으로 등록되었습니다!');
            window.location.href = `/e-learning/detail/${data.lectureId}`;
        } catch (error) {
            console.error('Error:', error);
            alert('강의 등록에 실패했습니다. 서버 오류가 발생했습니다.');
        }
    }

    // DOMContentLoaded 안에서 editor 초기화
    document.addEventListener('DOMContentLoaded', function () {
        const editorElement = document.querySelector('#editor');
        const editor = new toastui.Editor({
            el: editorElement,
            height: '400px',
            initialEditType: 'wysiwyg',
            previewStyle: 'tab',
        });

        // editor를 전역 변수로 설정
        window.editor = editor; // 전역 변수로 할당

        const form = document.querySelector('#lectureForm');
        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            await submitForm();
        });
    });

    async function validateForm(form, editor) {
        const title = document.querySelector('#titleInput').value.trim();
        const price = document.querySelector('#priceInput').value;
        const video = document.querySelector('#videoUpload').files;
        const categoryIds = document.querySelectorAll('input[name="categoryIds"]:checked');
        const description = editor.getHTML().trim();

        if (title.length < 5 || title.length > 100) {
            alert('강의 제목은 최소 5자 이상, 최대 100자 이하여야 합니다.');
            return false;
        }
        if (price === "" || price < 0 || price >= 1000000) {
            alert('가격은 0원 이상, 최대 1,000,000원까지 설정할 수 있습니다.');
            return false;
        }
        if (video.length === 0 || !video[0].type.startsWith('video/')) {
            alert('영상 파일을 선택하고 올바른 파일 형식인지 확인하세요.');
            return false;
        }
        if (categoryIds.length === 0) {
            alert('카테고리를 하나 이상 선택해 주세요.');
            return false;
        }
        if (description.length === 0 || description.length > 1000) {
            alert('강의 설명은 필수 입력값이며 최대 1000자까지 가능합니다.');
            return false;
        }
        return validateVideoDuration(video[0]);
    }

    function validateVideoDuration(file) {
        return new Promise((resolve) => {
            const fileURL = URL.createObjectURL(file);
            const videoElement = document.createElement('video');
            videoElement.src = fileURL;
            videoElement.preload = 'metadata';

            videoElement.onloadedmetadata = function () {
                URL.revokeObjectURL(fileURL);
                const duration = Math.round(videoElement.duration);
                document.querySelector('#videoDuration').value = formatDuration(duration);

                if (duration < 60 || duration > 900) {
                    alert('강의 영상은 최소 1분 이상, 최대 15분 이하여야 합니다.');
                    resolve(false);
                } else {
                    resolve(true);
                }
            };
        });
    }

    function formatDuration(seconds) {
        const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }
</script>
</body>

</html>
