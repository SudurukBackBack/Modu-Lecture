<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <!-- head 부분 포함 -->
    <div th:replace="layout/head :: head"></div>
</head>
<body>
<!-- navbar 부분 포함 -->
<div th:insert="layout/navbar :: navbar"></div>

<!-- Section -->
<section class="py-5">
    <div class="container px-4 px-lg-5">
        <div class="row">
            <!-- mypage vertical navigation bar -->
<!--            <div th:insert="layout/mypage-navbar :: mypage-navbar"></div>-->
            <nav th:fragment="mypage-navbar" class="col-md-3">
                <div class="border rounded p-4">
                    <h4 class="mb-4 text-start">마이페이지</h4>
                    <hr>
                    <ul class="nav flex-column text-start">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/mypage">나의 정보</a>
                        </li>
                        <hr>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/mypage-lecture">수강 목록</a>
                        </li>
                        <hr>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/mypage-tutor">나의 강의 관리</a>
                        </li>
                        <hr>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/mypage-account">계정</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 오른쪽 내용 -->
            <div class="col-md-9">
                <h2 class="mb-4 mt-3 ms-3">나의 정보</h2>
                <form th:action="@{/lectures/register}" method="post" class="ms-3">
                    <!-- 이름 입력 -->
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">이름</label>
                        <input type="text" class="form-control form-control-sm" id="nameInput" name="name" value="김모두">
                    </div>

                    <!-- 이메일 입력 -->
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">이메일</label>
                        <input type="email" class="form-control form-control-sm" id="emailInput" name="email" value="modu@gmail.com">
                    </div>

                    <!-- 비밀번호 입력 -->
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">비밀번호</label>
                        <input type="password" class="form-control form-control-sm" id="passwordInput" name="password" value="modu1234">
                    </div>

                    <!-- 경계선 -->
                    <hr>

                    <!-- 수정 버튼 -->
                    <button type="submit" class="btn btn-primary">수정</button>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Footer-->
<div th:insert="layout/footer :: footer"></div>

<!-- JS CDN -->
<div th:replace="layout/js-cdn :: js-cdn"></div>
</body>
</html>
