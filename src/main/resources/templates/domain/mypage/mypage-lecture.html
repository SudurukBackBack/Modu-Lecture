<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:fragment="head">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 마이페이지 | 수강목록</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>

    <style>
        /* 기본 링크 스타일 제거 */
        a {
            text-decoration: none; /* 링크의 기본 밑줄 제거 */
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            padding-bottom: 65%; /* 5:3 비율을 유지하기 위한 패딩 */
            background-color: #f0f0f0; /* 기본 배경색 (이미지가 없는 경우를 대비) */
        }

        .thumbnail-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지를 박스에 맞게 자름 */
        }

        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .card-body2 {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
        }

        /* 카드 호버 시 살짝 올라가는 효과 */
        .card {
            transition: transform 0.3s ease; /* 변환 효과 */
        }

        .card:hover {
            transform: translateY(-10px); /* 위로 10px 올라가게 */
        }
    </style>

</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">

            <!-- mypage vertical navigation bar -->
            <div th:replace="~{layout/mypage-navbar :: mypage-navbar}"></div>

            <!-- 오른쪽 내용 -->
            <div class="col-md-9">
                <h2 class="mb-4 mt-3">수강 목록</h2>
                <hr>

                <!-- 수강중인 강의 목록 시작 -->
                <div class="row">
                    <div div th:if="${enrolledLectures == null}" class="col-md-12 text-center">
                        <p class="text-muted"><i class="bi bi-archive"></i> 현재 수강 중인 강의가 없습니다.</p>
                    </div>

                    <!-- 강의 카드를 반복문으로 출력 -->
                    <div th:each="lecture : ${enrolledLectures}" class="col-md-4 mb-4">
                        <div class="card">
                            <div class="thumbnail-box">
                                <img src="/images/thumbnail.png" class="card-img-top" alt="썸네일">
                                <!-- 플레이 아이콘 -->
                                <div class="position-absolute top-50 start-50 translate-middle">
                                    <i class="bi bi-play-circle-fill" style="font-size: 40px; color: rgba(255, 255, 255, 0.8);"></i>
                                </div>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${lecture.title}">강의 제목</h5>
                                <a th:href="@{/e-learning/{lectureId}(lectureId=${lecture.lectureId})}" class="btn btn-primary block">수강하기</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 수강 중인 강의 목록 종료 -->
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

</body>
</html>
