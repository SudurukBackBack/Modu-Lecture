<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:fragment="head">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>모두의강의 - 마이페이지 | 수강목록</title>

    <!-- CSS-CDN -->
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- navbar 부분 포함 -->
<div th:insert="~{layout/navbar :: navbar}"></div>

<!-- Section -->
<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">

            <!-- mypage vertical navigation bar -->
            <div th:replace="~{layout/mypage-navbar :: mypage-navbar}"></div>

            <!-- 오른쪽 내용 -->
            <div class="col-md-9">
                <h2 class="mb-4 mt-3">수강 목록</h2>
                <hr>

                <!-- 수강중인 강의 목록 시작 -->
                <div class="row">
                    <!-- 수강 강의가 없을 경우 -->
                    <div th:if="${lectures.isEmpty()}" class="col-md-12 text-center">
                        <p class="text-muted">현재 수강 중인 강의가 없습니다.</p>
                    </div>

                    <!-- 수강 강의가 있을 경우 -->
                    <div th:each="lecture : ${lectures}" class="col-md-4 mb-4">
                        <div class="card h-100">
                            <div class="position-relative">
                                <img src="/images/test.jpg" class="card-img-top" alt="강의 이미지">
                                <!-- 플레이 아이콘 -->
                                <div class="position-absolute top-50 start-50 translate-middle">
                                    <i class="bi bi-play-circle-fill" style="font-size: 40px; color: rgba(255, 255, 255, 0.8);"></i>
                                </div>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${lecture.title}">강의 제목</h5>
                                <h6 class="text-dark text-opacity-75" th:text="${lecture.instructor}">강사명</h6>
                                <hr>
                                <p class="card-text" th:text="${lecture.description}">강의 소개</p>
                                <a th:href="@{/mypage/lecture/{id}(id=${lecture.id})}" class="btn btn-primary">학습하기</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 수강 중인 강의 목록 종료 -->
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<div th:insert="~{layout/footer :: footer}"></div>

<!-- JS CDN -->
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>

</body>
</html>
