<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>모두의강의 - 강의 수정</title>
    <div th:replace="~{layout/css-cdn :: css-cdn}"></div>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:insert="~{layout/navbar :: navbar}"></div>

<section class="py-5 flex-fill">
    <div class="container px-4 px-lg-5">
        <div class="row">
            <div th:replace="~{layout/mypage-navbar :: mypage-navbar}"></div>

            <div class="col-md-9">
                <h2 class="mb-4 mt-3">강의 수정</h2>
                <hr>
                <div class="border rounded p-4">
                    <form th:action="@{/mypage/tutor-update/{id}(id=${lecture.lectureId})}" method="post">
                        <input type="hidden" name="_method" value="PATCH" />

                        <!-- 제목 입력 -->
                        <div class="mb-3 row">
                            <input type="text" class="form-control form-control-lg" id="titleInput" name="title"
                                   th:value="${lecture.title}">
                        </div>

                        <!-- 가격 입력 -->
                        <div class="mb-3 row">
                            <input type="number" class="form-control form-control-sm" id="priceInput" name="price"
                                   th:value="${lecture.price}">
                        </div>

                        <!-- 설명 입력 -->
                        <div class="mb-3 row">
                            <textarea class="form-control" id="descriptionInput" name="description"
                                      th:text="${lecture.description}"></textarea>
                        </div>

                        <hr>

                        <!-- 수정 버튼 -->
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">수정 완료</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:insert="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/js-cdn :: js-cdn}"></div>
</body>
</html>
